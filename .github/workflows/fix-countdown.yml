name: Fix countdown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir contador
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function countdown(){let d=Math.max(0,WEDDING-new Date());days.textContent=Math.floor(d/86400000).toLocaleString('pt-BR');hours.textContent=Math.floor(d%86400000/3600000);mins.textContent=Math.floor(d%3600000/60000)}countdown();setInterval(countdown,60000);render();"
          new="function countdown(){const now=new Date(),d=Math.max(0,WEDDING-now),elDays=document.getElementById('days'),elHours=document.getElementById('hours'),elMins=document.getElementById('mins'),elSecs=document.getElementById('secs');elDays.textContent=Math.floor(d/86400000).toLocaleString('pt-BR');elHours.textContent=String(Math.floor(d%86400000/3600000)).padStart(2,'0');elMins.textContent=String(Math.floor(d%3600000/60000)).padStart(2,'0');if(elSecs)elSecs.textContent=String(Math.floor(d%60000/1000)).padStart(2,'0')}countdown();setInterval(countdown,1000);render();"
          if old in s:
              s=s.replace(old,new)
              s=s.replace('<span>minutos</span></div></div>','<span>minutos</span></div><div class="cd"><b id="secs">00</b><span>segundos</span></div></div>')
              p.write_text(s,encoding='utf-8')
          else:
              print('Marcador já corrigido ou não encontrado; nada a fazer.')
          PY
      - name: Publicar correção
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrigir contagem regressiva'
          git push

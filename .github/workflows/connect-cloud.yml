name: Connect Wedding Hub Cloud

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir conexão cloud no index
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<script type="module" src="\./cloud\.js(?:\?[^\"]*)?"></script>', '<script type="module" src="./cloud.js?v=6"></script>', text)
          if './cloud-loader.js?v=6' not in text and './cloud.js?v=6' not in text:
              text = text.replace('</body>', '<script src="./cloud-loader.js?v=6"></script>\n</body>', 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit cloud connection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualizar conexão online do Wedding Hub"
            git push
          fi

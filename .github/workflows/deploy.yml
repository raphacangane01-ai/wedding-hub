name: Deploy Wedding Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site enhancements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- WEDDING_HUB_RUNTIME -->'
          if marker not in text:
              runtime = '''<!-- WEDDING_HUB_RUNTIME -->
          <script src="./auto-budget.js?v=2"></script>
          <script src="./wedding-features.js?v=2"></script>
          <script src="./cloud-loader.js?v=3"></script>
          <script>
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=5').catch(()=>{});
          }
          </script>'''
              text = text.replace('</body>', runtime + '</body>')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Wedding Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- WEDDING_HUB_RUNTIME -->'
          runtime = '''<!-- WEDDING_HUB_RUNTIME -->
          <script src="./runtime-fixes.js?v=12"></script>
          <script src="./auto-budget.js?v=6"></script>
          <script src="./wedding-features.js?v=6"></script>
          <script src="./cloud-loader.js?v=6"></script>
          <script>
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{});
          </script>'''
          if marker in text:
              start = text.index(marker)
              end = text.index('</body>', start)
              text = text[:start] + runtime + '\n' + text[end:]
          else:
              text = text.replace('</body>', runtime + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')

          Path('sw.js').write_text("""const CACHE='wedding-hub-v12';
          const CORE=['./','./index.html','./manifest.json','./icon.svg','./runtime-fixes.js','./cloud-loader.js?v=6','./cloud.js?v=6','./auto-budget.js?v=6','./checklist-upgrade.js?v=6','./payment-upgrade.js?v=6','./wedding-features.js?v=6'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(CORE.map(u=>new Request(u,{cache:'reload'}))).catch(()=>{})).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('wedding-hub-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;const url=new URL(event.request.url);if(url.origin!==location.origin)return;if(event.request.mode==='navigate'){event.respondWith(fetch('./index.html',{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put('./index.html',copy));return r}).catch(()=>caches.match('./index.html')));return}event.respondWith(caches.match(event.request).then(cached=>cached||fetch(event.request).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(event.request,copy))}return r}).catch(()=>cached)))});
          """, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
